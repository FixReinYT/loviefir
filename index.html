<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101114"><title>ЛовиЭфир — видео, которые хочется смотреть</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191b20;--panel2:#242730;--line:#343842;--muted:#a5a9b3;--text:#f5f5f7;--accent:#b6f477}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{height:66px;position:sticky;top:0;z-index:10;background:#141519ed;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 25px;gap:24px}.brand{font-size:23px;font-weight:850;letter-spacing:-1px;white-space:nowrap}.brand span{color:var(--accent)}.search{max-width:570px;flex:1;margin:auto;display:flex}.search input{width:100%;min-width:0;border:1px solid var(--line);background:#202229;border-radius:11px 0 0 11px;padding:10px 14px;color:white}.search button,.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:10px}.search button{border-radius:0 11px 11px 0}.btn.primary{background:var(--accent);border-color:var(--accent);color:#18220e;font-weight:750}.btn:hover,.mini:hover{filter:brightness(1.12)}.user-actions{display:flex;align-items:center;gap:9px;white-space:nowrap}.user-name{color:var(--muted);font-size:13px}
.layout{max-width:1500px;margin:auto;display:grid;grid-template-columns:205px minmax(0,1fr);gap:28px;padding:25px 28px}.sidebar{position:sticky;top:90px;align-self:start}.navgroup{display:grid;gap:6px}.navitem{display:flex;align-items:center;gap:13px;border:0;background:transparent;color:#c9cbd1;padding:12px 14px;border-radius:10px;text-align:left;font-weight:600}.navitem .ico{width:22px;text-align:center;font-size:18px}.navitem:hover,.navitem.active{background:#252a2d;color:var(--accent)}.side-note{border-top:1px solid var(--line);margin-top:24px;padding:18px 12px;color:var(--muted);font-size:12px}.content{min-width:0}
.hero{border:1px solid #333a31;border-radius:18px;background:radial-gradient(ellipse at 90% 0%,#40542d 0,transparent 48%),linear-gradient(120deg,#222923,#181b20 70%);padding:30px 34px;margin-bottom:28px}.eyebrow{color:var(--accent);font-weight:750;text-transform:uppercase;font-size:11px;letter-spacing:1.5px}.hero h1{font-size:clamp(26px,4vw,38px);line-height:1.1;margin:10px 0}.hero p{color:#c1c8bc;max-width:620px;margin:0 0 18px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:25px 0 16px}.section-head h1,.section-head h2{margin:0;font-size:25px}.section-head p{margin:4px 0 0;color:var(--muted)}.tabs,.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}.tab,.chip{border:1px solid var(--line);background:#1b1d23;color:#c5c7cd;border-radius:999px;padding:8px 14px}.tab.active,.chip.active{background:var(--accent);border-color:var(--accent);color:#19230e;font-weight:750}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 17px}.video-card{min-width:0}.thumb{width:100%;aspect-ratio:16/9;border-radius:13px;background:linear-gradient(140deg,#2e3931,#1c2220 55%,#30352d);position:relative;display:grid;place-items:center;overflow:hidden;border:1px solid #333a35}.thumb img{width:100%;height:100%;object-fit:cover}.play{position:absolute;width:46px;height:46px;border-radius:50%;background:#111d;color:var(--accent);display:grid;place-items:center;font-size:20px}.topic{position:absolute;left:10px;bottom:9px;background:#111c;padding:4px 9px;border-radius:6px;font-size:11px}.video-info{display:flex;gap:10px;padding-top:11px}.avatar{flex:none;width:38px;height:38px;border-radius:50%;background:#303d2b;color:var(--accent);display:grid;place-items:center;font-weight:800;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.video-copy{min-width:0;flex:1}.video-title{font-weight:700;line-height:1.35;display:block;margin-bottom:5px;overflow-wrap:anywhere}.meta,.submeta{color:var(--muted);font-size:12px}.channel-link{color:#c3c6cc}.channel-link:hover{color:var(--accent)}.card-actions{display:flex;gap:7px;flex-wrap:wrap;margin:9px 0 0 48px}.mini{border:1px solid var(--line);background:#1d2026;color:#c9cbd0;border-radius:7px;padding:6px 9px;font-size:12px}.mini[aria-pressed=true]{border-color:#789a53;color:var(--accent)}
.empty{padding:45px 20px;text-align:center;border:1px dashed #3a3e46;border-radius:15px;color:var(--muted)}.empty strong{display:block;color:var(--text);font-size:18px;margin-bottom:6px}
.cover{height:190px;border-radius:16px;background:radial-gradient(ellipse at 80% 20%,#58763b,transparent 50%),linear-gradient(120deg,#252e24,#191c21);border:1px solid #384332;background-size:cover;background-position:center}.profile-head{display:flex;align-items:end;gap:17px;margin:-43px 22px 22px;position:relative}.profile-head .avatar{width:94px;height:94px;font-size:32px;border:5px solid var(--bg)}.profile-title{flex:1;min-width:180px;padding-bottom:5px}.profile-title h1{margin:0;font-size:27px}.handle{color:var(--muted);font-size:13px}.bio{color:#c5c8cf;margin:9px 0 0;white-space:pre-wrap;max-width:780px}.stats{display:flex;gap:20px;color:var(--muted);font-size:13px;margin-top:7px}.stats b{color:var(--text)}.profile-actions{padding-bottom:8px}.profile-links{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;color:var(--accent);font-size:13px}.profile-tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:15px 0 20px}.profile-tabs button{border:0;background:none;color:var(--muted);padding:10px 2px}.profile-tabs button.active{color:var(--accent);border-bottom:2px solid var(--accent)}
.player-wrap{max-width:1050px;margin:0 auto 26px}.player-wrap video{width:100%;max-height:68vh;background:#000;border-radius:14px}.player-details{display:flex;justify-content:space-between;gap:15px;margin-top:14px}.player-details h1{font-size:23px;margin:0}.player-channel{display:flex;align-items:center;gap:10px;margin-top:12px}.description{white-space:pre-wrap;color:#c6c8ce;margin:16px 0;padding:14px;background:#1a1c22;border-radius:12px}.comments{max-width:900px}.comment{border-bottom:1px solid var(--line);padding:12px 0}.comment small{color:var(--muted)}.dashboard{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:15px 0}.statbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}.statbox b{display:block;font-size:24px}.statbox span{color:var(--muted);font-size:12px}
dialog{width:min(620px,calc(100vw - 26px));max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:17px;background:#1a1c22;color:var(--text);padding:0;box-shadow:0 24px 80px #0009}dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}.dialog-inner{padding:24px}.dialog-inner h2{margin:0 0 16px}.field{display:grid;gap:6px;margin:12px 0;color:#d6d7dc;font-size:13px}.field input,.field textarea,.field select{width:100%;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:#111318;color:white}.field textarea{min-height:90px;resize:vertical}.field small{color:var(--muted)}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.checks{display:flex;gap:16px;flex-wrap:wrap;color:#d1d3d9;font-size:13px}.dialog-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.status{color:var(--accent);min-height:20px;font-size:13px}.notice{color:#ffbf86;margin:8px 0}.mobile-nav{display:none}.manage-row{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}.manage-row .grow{flex:1;min-width:0}.manage-row strong{display:block;overflow-wrap:anywhere}.manage-row small{color:var(--muted)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:180px minmax(0,1fr);gap:20px}}
@media(max-width:720px){.top{height:60px;padding:0 12px;gap:10px}.brand{font-size:20px}.search{max-width:none}.search input{padding:9px}.search button{padding:8px}.user-name{display:none}.user-actions{gap:5px}.user-actions .btn{padding:7px 9px;font-size:12px}.layout{display:block;padding:15px 13px 80px}.sidebar{display:none}.mobile-nav{display:flex;position:fixed;z-index:12;bottom:0;left:0;right:0;background:#17191eee;border-top:1px solid var(--line);justify-content:space-around;padding:7px 4px calc(7px + env(safe-area-inset-bottom))}.mobile-nav .navitem{display:grid;justify-items:center;gap:0;font-size:10px;padding:5px 8px}.hero{padding:22px 19px}.profile-head{margin-left:8px;margin-right:8px;gap:10px;flex-wrap:wrap}.profile-head .avatar{width:78px;height:78px}.profile-title h1{font-size:22px}.profile-actions{width:100%;padding-left:88px}.stats{gap:12px;flex-wrap:wrap}.dashboard{grid-template-columns:repeat(2,1fr)}}
@media(max-width:460px){.grid{grid-template-columns:1fr}.thumb{aspect-ratio:16/8}.search button{font-size:0}.search button:after{content:"⌕";font-size:19px}.user-actions #uploadBtn{display:none}.two{grid-template-columns:1fr}.hero h1{font-size:27px}}
.subscription-list{display:grid;gap:12px}.subscription-row{display:grid;grid-template-columns:150px 58px minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}.subscription-banner{height:76px;border-radius:9px;background:linear-gradient(130deg,#34412f,#20252a);background-size:cover;background-position:center}.subscription-row .avatar{width:58px;height:58px;font-size:22px}.subscription-info{min-width:0}.subscription-info strong{display:block;font-size:16px}.subscription-info .handle,.subscription-info .meta{display:block}.subscription-info .bio{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0}.subscription-actions{display:flex;gap:8px;align-items:center}.subscription-actions .btn{white-space:nowrap}@media(max-width:650px){.subscription-row{grid-template-columns:56px minmax(0,1fr);gap:10px}.subscription-banner{display:none}.subscription-row .avatar{grid-row:1;grid-column:1}.subscription-info{grid-row:1;grid-column:2}.subscription-actions{grid-column:1/-1;justify-content:flex-end}.subscription-info .bio{white-space:normal}}</style></head><body>
<header class="top"><a class="brand" href="/" id="brand">Лови<span>Эфир</span></a><form class="search" id="searchForm"><input id="search" type="search" placeholder="Поиск видео, каналов и тегов" aria-label="Поиск"><button aria-label="Найти">⌕</button></form><div class="user-actions"><span class="user-name" id="identity"></span><button class="btn" id="account">Войти</button><button class="btn primary" id="uploadBtn">Загрузить</button></div></header>
<div class="layout"><aside class="sidebar"><nav class="navgroup"><button class="navitem active" data-page="home"><span class="ico">⌂</span>Главная</button><button class="navitem" data-page="subs"><span class="ico">▣</span>Подписки</button><button class="navitem" data-page="channel"><span class="ico">◉</span>Мой канал</button><button class="navitem" data-page="studio"><span class="ico">▤</span>Студия автора</button></nav><div class="side-note">ЛовиЭфир — место для твоих видео и авторов, за которыми интересно следить.</div></aside><main class="content" id="view"><div class="empty">Загружаем ЛовиЭфир…</div></main></div>
<nav class="mobile-nav"><button class="navitem active" data-page="home"><span class="ico">⌂</span>Главная</button><button class="navitem" data-page="subs"><span class="ico">▣</span>Подписки</button><button class="navitem" data-page="channel"><span class="ico">◉</span>Мой канал</button><button class="navitem" data-page="studio"><span class="ico">▤</span>Студия</button></nav>
<dialog id="auth"><form class="dialog-inner" id="credentials"><h2>Войти в ЛовиЭфир</h2><label class="field">Название канала<input name="name" required maxlength="60" autocomplete="username"></label><label class="field">Пароль<input name="password" type="password" required minlength="8" maxlength="200" autocomplete="current-password"></label><div class="dialog-actions"><button class="btn primary" value="login">Войти</button><button class="btn" value="register">Создать канал</button><button class="btn close" type="button">Отмена</button></div><p class="status"></p></form></dialog>
<dialog id="profileDialog"><form class="dialog-inner" id="profileForm"><h2>Настройки канала</h2><label class="field">Название канала<input name="name" maxlength="60" required></label><label class="field">Уникальный псевдоним (@handle)<input name="handle" maxlength="24" placeholder="my_channel" required><small>3–24 символа: латиница, цифры и подчёркивание.</small></label><label class="field">Описание канала<textarea name="description" maxlength="2000" placeholder="Расскажи о себе и своём канале"></textarea></label><label class="field">Ссылки на соцсети<textarea name="links" placeholder="https://... — мой Telegram&#10;https://... — мой сайт"></textarea><small>Каждая ссылка с новой строки.</small></label><div class="two"><label class="field">Аватарка JPG/PNG/WebP<input type="file" name="avatar" accept="image/jpeg,image/png,image/webp"></label><label class="field">Шапка канала JPG/PNG/WebP<input type="file" name="banner" accept="image/jpeg,image/png,image/webp"></label></div><div class="dialog-actions"><button class="btn primary">Сохранить изменения</button><button class="btn close" type="button">Отмена</button></div><p class="status"></p></form></dialog>
<dialog id="upload"><form class="dialog-inner" id="publish"><h2>Опубликовать видео</h2><label class="field">Название<input required maxlength="120" name="title"></label><label class="field">Описание<textarea name="description" maxlength="5000" placeholder="Расскажи зрителям о видео"></textarea></label><div class="two"><label class="field">Категория<select name="topic"><option>Анимация</option><option>Игры</option><option>Музыка</option><option>Образование</option><option>Путешествия</option><option>Развлечения</option><option>Другое</option></select></label><label class="field">Теги<input name="tags" placeholder="minecraft, animation, vlog"></label></div><label class="field">Видеофайл MP4 или WebM<input name="file" type="file" required accept="video/mp4,video/webm"><small>Максимум 512 МБ.</small></label><div class="two"><label class="field">Обложка видео<input name="thumbnail" type="file" accept="image/jpeg,image/png,image/webp"></label><label class="field">Доступ<select name="visibility"><option value="public">Открытый доступ</option><option value="unlisted">Доступ по ссылке</option><option value="private">Приватное</option></select></label></div><label class="field">Аудитория<select name="audience"><option value="general">Не предназначено специально для детей</option><option value="kids">Предназначено для детей</option></select></label><div class="checks"><label><input type="checkbox" name="comments" checked> Разрешить комментарии</label></div><div class="dialog-actions"><button class="btn primary">Опубликовать</button><button class="btn close" type="button">Отмена</button></div><p class="status"></p></form></dialog>
<dialog id="editVideo"><form class="dialog-inner" id="editForm"><h2>Редактировать видео</h2><input type="hidden" name="id"><label class="field">Название<input name="title" maxlength="120" required></label><label class="field">Описание<textarea name="description" maxlength="5000"></textarea></label><div class="two"><label class="field">Категория<select name="topic"><option>Анимация</option><option>Игры</option><option>Музыка</option><option>Образование</option><option>Путешествия</option><option>Развлечения</option><option>Другое</option></select></label><label class="field">Теги<input name="tags"></label></div><label class="field">Обложка<input type="file" name="thumbnail" accept="image/jpeg,image/png,image/webp"></label><label class="field">Доступ<select name="visibility"><option value="public">Открытый</option><option value="unlisted">По ссылке</option><option value="private">Приватный</option></select></label><label class="field">Аудитория<select name="audience"><option value="general">Не предназначено специально для детей</option><option value="kids">Для детей</option></select></label><label><input type="checkbox" name="comments" checked> Разрешить комментарии</label><div class="dialog-actions"><button class="btn primary">Сохранить</button><button class="btn close" type="button">Отмена</button></div><p class="status"></p></form></dialog>
<dialog id="playlistDialog"><form class="dialog-inner" id="playlistForm"><h2>Новый плейлист</h2><label class="field">Название<input name="title" required maxlength="100"></label><label class="field">Описание<textarea name="description" maxlength="1000"></textarea></label><div class="dialog-actions"><button class="btn primary">Создать</button><button class="btn close" type="button">Отмена</button></div><p class="status"></p></form></dialog>
<script type="module">
const $=id=>document.getElementById(id),view=$('view'),topics=['Анимация','Игры','Музыка','Образование','Путешествия','Развлечения','Другое'];
const el=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
async function api(url,options){const r=await fetch(url,options),d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка запроса');return d}
const post=(url,data)=>api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});
let me=null,currentPage='home',revision=0,currentVideo=null;
function setNav(page){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));currentPage=page}
function avatar(u,cls='avatar'){const a=el('div',undefined,cls);if(u?.avatar){const img=el('img');img.src='/asset/'+u.avatar;img.alt='Аватар';a.append(img)}else a.textContent=(u?.name||'?').trim().slice(0,1).toUpperCase();return a}
function empty(title,desc){const e=el('div',undefined,'empty');e.append(el('strong',title),el('span',desc));return e}
function section(title,sub){const h=el('div',undefined,'section-head'),left=el('div');left.append(el('h2',title),el('p',sub));h.append(left);return h}
function showError(message){let n=$('globalNotice');if(!n){n=el('p',undefined,'notice');n.id='globalNotice';view.prepend(n)}n.textContent=message}
function card(v){const c=el('article',undefined,'video-card'),thumb=el('a',undefined,'thumb');thumb.href='/?v='+encodeURIComponent(v.id);if(v.thumbnail){const im=el('img');im.src='/asset/'+v.thumbnail;thumb.append(im)}thumb.append(el('span','▶','play'),el('span',v.topic,'topic'));thumb.addEventListener('click',e=>{e.preventDefault();openVideo(v)});
const info=el('div',undefined,'video-info');info.append(avatar({name:v.name,avatar:v.avatar}));const copy=el('div',undefined,'video-copy'),title=el('a',v.title,'video-title');title.href='/?v='+encodeURIComponent(v.id);title.onclick=e=>{e.preventDefault();openVideo(v)};const author=el('a',v.name+(v.handle?' · @'+v.handle:''),'channel-link');author.href='/?channel='+v.uid;author.onclick=e=>{e.preventDefault();history.pushState({},'','/?channel='+v.uid);openChannel(v.uid)};copy.append(title,author,el('div',new Date(v.created).toLocaleDateString('ru-RU')+' · '+(v.views||0)+' просмотров','meta'));info.append(copy);c.append(thumb,info);
if(me&&v.uid===me.id){const a=el('div',undefined,'card-actions'),b=el('button','Редактировать','mini');b.onclick=()=>editVideo(v);const d=el('button','Удалить','mini');d.onclick=async()=>{if(confirm('Удалить видео без возможности восстановления?')){try{await post('/api/video-delete',{id:v.id});await studio()}catch(e){showError(e.message)}}};a.append(b,d);c.append(a)}else if(me&&v.uid!==me.id){const a=el('div',undefined,'card-actions'),b=el('button',v.following?'Вы подписаны':'Подписаться','mini');b.onclick=async()=>{try{await post('/api/follow',{author:v.uid,enabled:!v.following});await loadFeed(currentPage==='subs'?'subs':'all')}catch(e){showError(e.message)}};a.append(b);c.append(a)}
return c}
function grid(items){const g=el('div',undefined,'grid');items.forEach(v=>g.append(card(v)));return g}
async function loadFeed(mode='all',topic=''){const rev=++revision;setNav('home');view.replaceChildren();view.append(section('Видео для тебя','Свежие видео авторов ЛовиЭфира'));const chips=el('div',undefined,'chips');const all=el('button','Все','chip'+(!topic?' active':''));all.onclick=()=>loadFeed('all','');chips.append(all);topics.forEach(t=>{const b=el('button',t,'chip'+(topic===t?' active':''));b.onclick=()=>loadFeed('all',t);chips.append(b)});view.append(chips);const q=$('search').value.trim(),items=await api('/api/videos?'+new URLSearchParams({mode:'all',q,topic}));if(rev!==revision)return;if(!items.length){view.append(empty('Пока нет видео','Попробуй изменить поиск или загляни сюда позже.'));return}view.append(grid(items))}
async function subscriptionsPage(){const rev=++revision;setNav('subs');history.pushState({},'','/?feed=subs');view.replaceChildren();view.append(section('Мои подписки','Каналы, на которые ты подписан'));if(!me){view.append(empty('Войди в ЛовиЭфир','После входа здесь появятся каналы, на которые ты подписался.'));const b=el('button','Войти','btn primary');b.onclick=()=>$('auth').showModal();view.append(b);return}const channels=await api('/api/subscriptions');if(rev!==revision)return;if(!channels.length){view.append(empty('Пока нет подписок','Найди интересного автора и нажми «Подписаться» — его канал появится здесь.'));const b=el('button','Найти каналы','btn primary');b.onclick=()=>home();view.append(b);return}const list=el('div',undefined,'subscription-list');channels.forEach(c=>{const row=el('article',undefined,'subscription-row'),banner=el('div',undefined,'subscription-banner');if(c.banner)banner.style.backgroundImage='url("/asset/'+c.banner+'")';const av=avatar(c),info=el('div',undefined,'subscription-info'),name=el('strong',c.name),handle=el('span','@'+(c.handle||'без_ника'),'handle'),stats=el('span',c.followers+' подписчиков · '+c.videos+' видео','meta');info.append(name,handle,stats);if(c.description)info.append(el('p',c.description,'bio'));const actions=el('div',undefined,'subscription-actions'),open=el('button','Открыть канал','btn primary'),unfollow=el('button','Отписаться','btn');open.onclick=()=>{history.pushState({},'','/?channel='+c.id);openChannel(c.id)};unfollow.onclick=async()=>{unfollow.disabled=true;try{await post('/api/follow',{author:c.id,enabled:false});await subscriptionsPage()}catch(e){showError(e.message);unfollow.disabled=false}};actions.append(open,unfollow);row.append(banner,av,info,actions);list.append(row)});view.append(list)}async function home(){history.pushState({},'','/');setNav('home');view.replaceChildren();const hero=el('section',undefined,'hero');hero.append(el('div','ТВОЯ ВИДЕОПЛАТФОРМА','eyebrow'),el('h1','Смотри. Создавай. Делись.'),el('p','Открывай новые видео, находи авторов и собирай собственную ленту из каналов, которые тебе интересны.'));const b=el('button','Опубликовать видео','btn primary');b.onclick=()=>me?$('upload').showModal():$('auth').showModal();hero.append(b);view.append(hero);await loadFeed('all')}
async function openChannel(id,tab='Видео'){const rev=++revision;setNav('channel');view.replaceChildren();const c=await api('/api/channel?id='+encodeURIComponent(id));if(rev!==revision)return;
const cover=el('div',undefined,'cover');if(c.banner)cover.style.backgroundImage='url("/asset/'+c.banner+'")';const head=el('div',undefined,'profile-head');head.append(avatar(c));const title=el('div',undefined,'profile-title');title.append(el('h1',c.name),el('div','@'+(c.handle||'без_ника'),'handle'));const stats=el('div',undefined,'stats');stats.append(el('span',undefined));stats.lastChild.append(el('b',String(c.followers)),' подписчиков');stats.append(el('span',undefined));stats.lastChild.append(el('b',String(c.following)),' подписок');stats.append(el('span',undefined));stats.lastChild.append(el('b',String(c.videos.length)),' видео');title.append(stats);if(c.description)title.append(el('p',c.description,'bio'));const links=el('div',undefined,'profile-links');try{JSON.parse(c.links||'[]').forEach(x=>{const a=el('a',x,'');a.href=x.split(' — ')[0];a.target='_blank';a.rel='noopener';links.append(a)})}catch{}title.append(links);head.append(title);const actions=el('div',undefined,'profile-actions');
if(c.isMe){const b=el('button','Настроить канал','btn primary');b.onclick=()=>profileDialog(c);actions.append(b)}else if(me){const b=el('button',c.subscribed?'Вы подписаны':'Подписаться','btn primary');b.onclick=async()=>{try{await post('/api/follow',{author:c.id,enabled:!c.subscribed});openChannel(c.id,tab)}catch(e){showError(e.message)}};actions.append(b)}head.append(actions);view.append(cover,head);
const tabs=el('div',undefined,'profile-tabs');['Главная','Видео','Плейлисты','О канале'].forEach(t=>{const b=el('button',t+(tab===t?' active':''));b.onclick=()=>openChannel(c.id,t);tabs.append(b)});view.append(tabs);
if(tab==='О канале'){view.append(el('p',c.description||'Автор пока не добавил описание.','bio'));return}
if(tab==='Плейлисты'){const pls=await api('/api/playlists?uid='+c.id);if(pls.length){const list=el('div',undefined,'grid');pls.forEach(p=>{const item=el('button',undefined,'statbox');item.style='text-align:left;color:inherit;cursor:pointer';item.append(el('strong',p.title),el('p',p.description||'Подборка видео'),el('span',p.count+' видео'));item.onclick=()=>openPlaylist(p.id);list.append(item)});view.append(list)}else view.append(empty('Плейлистов пока нет','Автор ещё не создал подборки.'));return}
const vids=c.videos.filter(v=>v.visibility!=='private'||c.isMe);if(tab==='Главная')view.append(section('Добро пожаловать на канал',c.description||'Видео автора'));view.append(section('Видео канала','Опубликованные ролики'));if(vids.length)view.append(grid(vids));else view.append(empty('Пока нет публикаций','Когда автор загрузит видео, они появятся здесь.'))}
function profileDialog(c){const f=$('profileForm');f.elements.name.value=c.name;f.elements.handle.value=c.handle||'';f.elements.description.value=c.description||'';try{f.elements.links.value=JSON.parse(c.links||'[]').join('\n')}catch{f.elements.links.value=''}f.querySelector('.status').textContent='';$('profileDialog').showModal()}
async function editVideo(v){const f=$('editForm');f.elements.id.value=v.id;for(const k of ['title','description','topic','visibility','audience'])f.elements[k].value=v[k]||'';f.elements.tags.value=(v.tags||[]).join(', ');f.elements.comments.checked=!!v.comments_enabled;f.querySelector('.status').textContent='';$('editVideo').showModal()}
function uploadImage(file,endpoint,kind){return fetch(endpoint,{method:'POST',headers:{'Content-Type':file.type},body:file}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Не удалось загрузить изображение');return d})}
async function openVideo(v){history.pushState({},'','/?v='+encodeURIComponent(v.id));setNav('home');currentVideo=v;view.replaceChildren();const wrap=el('section',undefined,'player-wrap'),back=el('button','← Назад','back');back.onclick=()=>home();wrap.append(back);const video=el('video');video.controls=true;video.playsInline=true;video.preload='metadata';video.src='/media/'+encodeURIComponent(v.id);const details=el('div',undefined,'player-details'),left=el('div');left.append(el('h1',v.title));const author=el('a',undefined,'player-channel');author.href='/?channel='+v.uid;author.append(avatar({name:v.name}),el('span',v.name+(v.handle?' · @'+v.handle:'')));author.onclick=e=>{e.preventDefault();openChannel(v.uid)};left.append(author);if(v.description)left.append(el('p',v.description,'description'));details.append(left);if(me){const tools=el('div',undefined,'dialog-actions');const lists=await api('/api/playlists');if(lists.length){const select=el('select');select.style='background:#191b20;color:white;border:1px solid #343842;border-radius:9px;padding:8px';lists.forEach(p=>{const o=el('option',p.title);o.value=p.id;select.append(o)});const add=el('button','В плейлист','btn');add.onclick=async()=>{try{await post('/api/playlist-add',{playlist:select.value,video:v.id});add.textContent='Добавлено'}catch(e){showError(e.message)}};tools.append(select,add)}if(v.uid===me.id){const b=el('button','Редактировать','btn');b.onclick=()=>editVideo(v);tools.append(b)}details.append(tools)}wrap.append(video,details);view.append(wrap);try{await post('/api/view',{video:v.id})}catch{}if(v.comments_enabled){const c=el('section',undefined,'comments');c.append(section('Комментарии','Обсуждение под видео'));if(me){const form=el('form'),input=el('textarea');input.placeholder='Написать комментарий…';input.required=true;input.maxLength=2000;input.style='width:100%;background:#191b20;color:white;border:1px solid #343842;border-radius:10px;padding:12px';const b=el('button','Отправить','btn primary');form.append(input,b);form.onsubmit=async e=>{e.preventDefault();try{await post('/api/comments',{video:v.id,text:input.value});input.value='';await showComments(c,v.id)}catch(err){showError(err.message)}};c.append(form)}else c.append(el('p','Войди, чтобы оставить комментарий.','meta'));await showComments(c,v.id);view.append(c)}}
async function showComments(container,id){const list=await api('/api/comments?video='+encodeURIComponent(id));container.querySelectorAll('.comment').forEach(n=>n.remove());list.forEach(x=>{const n=el('div',undefined,'comment');n.append(el('strong',x.name),el('small',' · '+new Date(x.created).toLocaleString('ru-RU')),el('p',x.text));container.append(n)})}
async function openPlaylist(id){const p=await api('/api/playlist?id='+encodeURIComponent(id));view.replaceChildren(section(p.title,p.description||'Плейлист ЛовиЭфира'));if(p.videos.length)view.append(grid(p.videos));else view.append(empty('Плейлист пуст','Добавь сюда видео со страницы просмотра.'))}
async function studio(){if(!me){$('auth').showModal();return}setNav('studio');history.pushState({},'','/?studio=1');view.replaceChildren();view.append(section('Студия автора','Управляй публикациями и следи за развитием канала'));const s=await api('/api/stats'),dash=el('div',undefined,'dashboard');[['Видео',s.videos],['Просмотры',s.views],['Подписчики',s.followers],['Комментарии',s.comments]].forEach(([k,v])=>{const b=el('div',undefined,'statbox');b.append(el('b',String(v)),el('span',k));dash.append(b)});view.append(dash);const actions=el('div',undefined,'dialog-actions'),upload=el('button','Загрузить видео','btn primary'),profile=el('button','Настроить канал','btn'),pl=el('button','Создать плейлист','btn');upload.onclick=()=>$('upload').showModal();profile.onclick=async()=>profileDialog(await api('/api/channel?id='+me.id));pl.onclick=()=>$('playlistDialog').showModal();actions.append(upload,profile,pl);view.append(actions,section('Мои публикации','Редактируй, скрывай или удаляй свои ролики'));const c=await api('/api/channel?id='+me.id);if(c.videos.length)view.append(grid(c.videos));else view.append(empty('Публикаций пока нет','Загрузи первое видео на свой канал.'))}
async function init(){me=await api('/api/me');$('identity').textContent=me?'@'+(me.handle||me.name):'';$('account').textContent=me?'Выйти':'Войти';const p=new URLSearchParams(location.search);if(p.has('channel'))await openChannel(p.get('channel'));else if(p.has('studio'))await studio();else if(p.get('feed')==='subs'){setNav('subs');await subscriptionsPage()}else if(p.has('v')){try{const v=await api('/api/video?id='+encodeURIComponent(p.get('v')));await openVideo(v)}catch{await home()}}else await home()}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.page==='home')home();else if(b.dataset.page==='subs'){history.pushState({},'','/?feed=subs');subscriptionsPage()}else if(b.dataset.page==='channel'){if(!me)$('auth').showModal();else{history.pushState({},'','/?channel='+me.id);openChannel(me.id)}}else studio().catch(e=>showError(e.message))});
$('brand').onclick=e=>{e.preventDefault();home()};$('searchForm').onsubmit=e=>{e.preventDefault();history.pushState({},'','/');setNav('home');loadFeed('all')};
$('account').onclick=async()=>{if(me){try{await post('/api/logout',{});me=null;await init()}catch(e){showError(e.message)}}else $('auth').showModal()};$('uploadBtn').onclick=()=>me?$('upload').showModal():$('auth').showModal();
document.querySelectorAll('.close').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$('credentials').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,s=e.submitter,status=f.querySelector('.status');s.disabled=true;try{await post('/api/'+s.value,Object.fromEntries(new FormData(f)));f.reset();$('auth').close();await init()}catch(err){status.textContent=err.message}finally{s.disabled=false}};
$('profileForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,s=f.querySelector('.status'),b=e.submitter;b.disabled=true;try{const data=new FormData(f),links=data.get('links').split('\n').map(x=>x.trim()).filter(Boolean);const p=await post('/api/profile',{name:data.get('name'),handle:data.get('handle'),description:data.get('description'),links});for(const kind of ['avatar','banner']){const file=data.get(kind);if(file?.size){if(file.size>(kind==='avatar'?5:10)*1024*1024)throw Error('Изображение слишком большое');await uploadImage(file,'/api/profile-image?kind='+kind,kind)}}$('profileDialog').close();me=await api('/api/me');$('identity').textContent='@'+me.handle;await openChannel(me.id)}catch(err){s.textContent=err.message}finally{b.disabled=false}};
$('publish').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,b=e.submitter,s=f.querySelector('.status'),d=new FormData(f),file=d.get('file');b.disabled=true;try{if(!file?.size||file.size>512*1024*1024)throw Error('Выбери видео до 512 МБ');s.textContent='Загружаем видео…';const params=new URLSearchParams({title:d.get('title'),topic:d.get('topic'),description:d.get('description'),tags:d.get('tags'),visibility:d.get('visibility'),audience:d.get('audience'),comments:d.get('comments')?'1':'0'});const out=await api('/api/upload?'+params,{method:'POST',headers:{'Content-Type':file.type},body:file});const image=d.get('thumbnail');if(image?.size)await uploadImage(image,'/api/thumbnail?id='+out.id,'thumbnail');f.reset();$('upload').close();await studio()}catch(err){s.textContent=err.message}finally{b.disabled=false}};
$('editForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,d=new FormData(f),b=e.submitter,s=f.querySelector('.status');b.disabled=true;try{await post('/api/video',{id:d.get('id'),title:d.get('title'),description:d.get('description'),topic:d.get('topic'),tags:d.get('tags').split(',').map(x=>x.trim()).filter(Boolean),visibility:d.get('visibility'),audience:d.get('audience'),comments_enabled:d.get('comments')==='on'});const image=d.get('thumbnail');if(image?.size)await uploadImage(image,'/api/thumbnail?id='+d.get('id'),'thumbnail');$('editVideo').close();await studio()}catch(err){s.textContent=err.message}finally{b.disabled=false}};
$('playlistForm').onsubmit=async e=>{e.preventDefault();const f=e.currentTarget,s=f.querySelector('.status');try{await post('/api/playlist',Object.fromEntries(new FormData(f)));f.reset();$('playlistDialog').close();await studio()}catch(err){s.textContent=err.message}};
window.addEventListener('popstate',()=>init().catch(e=>{view.replaceChildren(empty('Не удалось загрузить страницу',e.message))}));init().catch(e=>view.replaceChildren(empty('Ошибка загрузки',e.message)));
</script></body></html>
